<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <title>Delete Review</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-success-subtle">
        <div class="container-fluid">
            <div class="navbar-nav w-100 text-center flex-lg-row">
                <a class="nav-link text-dark fs-5 fw-semibold flex-lg-fill"
                   href="{% url 'home' %}">Home</a>
                <a class="nav-link text-dark fs-5 fw-semibold flex-lg-fill"
                   href="{% url 'book_list' %}">Book Listings</a>
                <a class="nav-link text-dark fs-5 fw-semibold flex-lg-fill"
                   href="{% url 'review_create' %}">Write a Review</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="card border-danger shadow-sm mx-auto" style="max-width: 600px;">
                <div class="card-body p-4">
                    <h1 class="h3 text-danger mb-3">Delete Review</h1>
                    <p class="mb-4">Are you sure you want to delete this review?</p>
                    <form method="post" class="d-flex flex-wrap gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 BOTGO</p>
    </footer>
</body>
</html>
